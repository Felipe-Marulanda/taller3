<section class="showcase">
  <h1>Átomos</h1>
  <p>Son las piezas pequeñas que se pueden repetir en otras composiciones.</p>
  <div class="example">
    <h2>LabelAtom</h2>
    <dsb-label-atom text="Disponible" tone="green"></dsb-label-atom>
    <dsb-label-atom text="En revisión" tone="blue"></dsb-label-atom>
    <dsb-label-atom text="Borrador" tone="gray"></dsb-label-atom>
  </div>
  <div class="example">
    <h2>ActionButtonAtom</h2>
    <dsb-action-button-atom text="Probar acción" (pressed)="notify()"></dsb-action-button-atom>
    <dsb-action-button-atom text="Cancelar" style="outline"></dsb-action-button-atom>
    <p>{{ message }}</p>
  </div>
</section>
